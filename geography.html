<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>География поставок · Профпартнер</title>

  <!-- ГЕОГРАФИЯ: начало подключения стилей для вставки в <head>. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.3.2/css/flag-icons.min.css">
  <style>
    .supply-geography {
      /* Цвета блока. Меняйте значения после двоеточий. */
      --geo-primary: #12355b;
      --geo-accent: #f28c28;
      --geo-background: #f3f6f9;
      --geo-text: #526476;
      --geo-border: #d7e1e9;
      --geo-ease: cubic-bezier(.23, 1, .32, 1);
      position: relative;
      padding: clamp(44px, 6vw, 84px) 16px;
      border-block-start: 1px solid var(--geo-border);
      background: var(--geo-background);
      color: var(--geo-text);
      text-align: center;
      font: 400 16px/1.5 Inter, system-ui, sans-serif;
    }

    .supply-geography, .supply-geography * { box-sizing: border-box; }

    .supply-geography .geo-title {
      max-inline-size: 24ch;
      margin: 0 auto;
      color: var(--geo-primary);
      font: 800 clamp(29px, 4.15vw, 54px)/1.12 Inter, system-ui, sans-serif;
      letter-spacing: -.045em;
      text-wrap: balance;
    }

    .supply-geography .geo-subtitle {
      margin: 12px auto 0;
      max-inline-size: 48ch;
    }

    .supply-geography .geo-flag-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(9px, 1.5vw, 18px);
      max-inline-size: 1160px;
      min-block-size: 104px;
      margin: 23px auto 0;
    }

    .supply-geography .geo-rail {
      min-inline-size: 0;
      padding: 6px 6px 8px;
    }

    .supply-geography .geo-flag-row.is-expanded {
      display: grid;
      justify-items: center;
      max-inline-size: 720px;
    }

    .supply-geography .is-expanded .geo-rail { width: 100%; }
    .supply-geography .is-expanded .geo-toggle { grid-row: 1; }

    .supply-geography .geo-flags {
      display: flex;
      align-items: flex-start;
      inline-size: max-content;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .supply-geography .geo-flag-item {
      display: grid;
      justify-items: center;
      gap: 6px;
      margin-inline-end: -9px;
    }

    .supply-geography .geo-flag-item:last-child { margin-inline-end: 0; }

    .supply-geography .geo-flag-item[hidden] { display: none; }

    .supply-geography .geo-disc,
    .supply-geography .geo-toggle {
      display: grid;
      place-items: center;
      inline-size: clamp(50px, 8vw, 66px);
      block-size: clamp(50px, 8vw, 66px);
      border: 3px solid #fff;
      border-radius: 50%;
      box-shadow: 0 4px 9px #12355b23;
    }

    .supply-geography .geo-disc {
      background-color: #dce6ee;
      background-size: cover;
      transition: transform 200ms var(--geo-ease);
    }

    .supply-geography .geo-flag-label { display: none; }

    .supply-geography .is-expanded .geo-flags {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      inline-size: 100%;
      gap: 10px;
    }

    @media (max-width: 520px) {
      .supply-geography .is-expanded .geo-flags {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    .supply-geography .is-expanded .geo-flag-item {
      grid-template-columns: 34px minmax(0, 1fr);
      justify-items: start;
      align-items: center;
      gap: 9px;
      margin: 0;
      padding: 10px;
      border: 1px solid var(--geo-border);
      border-radius: 9px;
      background: white;
    }

    .supply-geography .is-expanded .geo-disc {
      inline-size: 34px;
      block-size: 34px;
      border-width: 2px;
    }

    .supply-geography .is-expanded .geo-flag-label {
      display: block;
      color: var(--geo-primary);
      font-size: 13px;
      text-align: start;
      overflow-wrap: anywhere;
    }

    .supply-geography .geo-toggle {
      flex-shrink: 0;
      background: var(--geo-accent);
      color: #402108;
      font: 750 clamp(17px, 3vw, 21px)/1 Inter, system-ui, sans-serif;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      transition: transform 200ms var(--geo-ease);
    }

    .supply-geography .geo-toggle[aria-expanded="true"] { font-size: 27px; }

    .supply-geography .geo-toggle:focus-visible,
    .supply-geography .geo-rail:focus-visible {
      outline: 3px solid var(--geo-accent);
      outline-offset: 2px;
    }

    @media (hover: hover) and (pointer: fine) {
      .supply-geography .geo-disc:hover {
        position: relative;
        z-index: 1;
        transform: translateY(-3px) scale(1.06);
      }
      .supply-geography .geo-toggle:hover { transform: translateY(-3px); }
    }

    @media (prefers-reduced-motion: no-preference) {
      .supply-geography .geo-arrived:not(.is-expanded) .geo-flag-item,
      .supply-geography .geo-arrived:not(.is-expanded) .geo-toggle {
        animation: geography-enter 380ms var(--geo-ease) backwards;
        animation-delay: calc(var(--geo-order) * 95ms);
      }

      .supply-geography .is-expanded .geo-flag-item {
        animation: geography-enter 440ms var(--geo-ease) backwards;
        animation-delay: calc(var(--geo-order) * 28ms);
      }
    }

    @keyframes geography-enter {
      from { opacity: 0; transform: translateY(8px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .supply-geography .geo-disc,
      .supply-geography .geo-toggle { transition: none; }
      .supply-geography .geo-disc:hover,
      .supply-geography .geo-toggle:hover { transform: none; }
    }
  </style>
  <!-- ГЕОГРАФИЯ: конец подключения стилей. -->
  <style>body { margin: 0; }</style>
</head>
<body>
  <!-- ГЕОГРАФИЯ: начало блока для вставки в <body>. -->
  <section class="supply-geography" id="geography" aria-labelledby="geography-title">
    <h2 class="geo-title" id="geography-title">Доставка по России и странам СНГ</h2>
    <p class="geo-subtitle">Ваш текст</p>

    <div class="geo-flag-row">
      <div class="geo-rail" id="geography-countries" role="region" aria-label="Флаги стран поставки">
        <ul class="geo-flags" role="list"></ul>
      </div>
      <button class="geo-toggle" type="button" aria-expanded="false" aria-controls="geography-countries"
        style="--geo-order: 3" aria-label="Показать все 14 стран">+11</button>
    </div>
  </section>
  <script>
    (() => {
      // Здесь редактируются названия стран, коды флагов и первые три флага.
      const featured = ['ru', 'kz', 'by'];
      const countries = [
        ['az', 'Азербайджан'],
        ['am', 'Армения'],
        ['by', 'Беларусь'],
        ['ge', 'Грузия'],
        ['kz', 'Казахстан'],
        ['kg', 'Киргизия'],
        ['lv', 'Латвия'],
        ['lt', 'Литва'],
        ['md', 'Молдова'],
        ['ru', 'Россия'],
        ['tj', 'Таджикистан'],
        ['tm', 'Туркменистан'],
        ['uz', 'Узбекистан'],
        ['ee', 'Эстония'],
      ];
      const names = new Map(countries);
      const featuredCountries = featured.filter(code => names.has(code));
      const alphabet = new Intl.Collator('ru');
      const remainingCountries = countries
        .filter(([code]) => !featuredCountries.includes(code))
        .sort((a, b) => alphabet.compare(a[1], b[1]));
      const orderedCountries = [
        ...featuredCountries.map(code => [code, names.get(code)]),
        ...remainingCountries,
      ];

      const section = document.getElementById('geography');
      const row = section.querySelector('.geo-flag-row');
      const rail = section.querySelector('.geo-rail');
      const list = section.querySelector('.geo-flags');
      const button = section.querySelector('.geo-toggle');
      const motion = matchMedia('(prefers-reduced-motion: reduce)');

      const items = orderedCountries.map(([code, name], index) => {
        const item = document.createElement('li');
        item.className = 'geo-flag-item';
        item.style.setProperty('--geo-order', index);

        const flag = document.createElement('span');
        flag.className = 'fi fi-' + code + ' fis geo-disc';
        flag.title = name;
        flag.setAttribute('role', 'img');
        flag.setAttribute('aria-label', name);

        const caption = document.createElement('span');
        caption.className = 'geo-flag-label';
        caption.setAttribute('aria-hidden', 'true');
        caption.textContent = name;
        item.append(flag, caption);
        list.append(item);
        return item;
      });

      let expanded = false;
      let hasAppeared = false;

      function setExpanded(open) {
        expanded = open;
        row.classList.toggle('is-expanded', open);
        row.classList.toggle('geo-arrived', hasAppeared && !open);
        button.setAttribute('aria-expanded', String(open));
        button.setAttribute('aria-label', open ? 'Свернуть флаги' : 'Показать все ' + countries.length + ' стран');
        button.textContent = open ? '×' : '+' + remainingCountries.length;
        if (open) rail.tabIndex = 0;
        else rail.removeAttribute('tabindex');
        items.forEach((item, index) => { item.hidden = !open && index >= featuredCountries.length; });
      }

      setExpanded(false);
      button.addEventListener('click', event => {
        setExpanded(!expanded);
        if (expanded && event.detail === 0) rail.focus({preventScroll: true});
      });
      document.addEventListener('click', event => {
        if (expanded && !section.contains(event.target)) setExpanded(false);
      });
      document.addEventListener('keydown', event => {
        if (event.key !== 'Escape' || !expanded) return;
        if (rail.contains(document.activeElement)) button.focus({preventScroll: true});
        setExpanded(false);
      });

      if ('IntersectionObserver' in window && !motion.matches) {
        const observer = new IntersectionObserver(entries => {
          if (!entries.some(entry => entry.isIntersecting)) return;
          observer.disconnect();
          hasAppeared = true;
          if (!expanded) row.classList.add('geo-arrived');
        }, {threshold: .55});
        observer.observe(row);
      }
    })();
  </script>
  <!-- ГЕОГРАФИЯ: конец блока. -->
</body>
</html>
